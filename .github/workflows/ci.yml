name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: zulu
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Build and verify release artifacts
        run: scripts/build-release.sh

  installer-windows:
    runs-on: windows-latest
    needs: native-parser
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: zulu
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-parser-*
          path: native-artifacts
          merge-multiple: true
      - name: Overlay CI-built native parser library
        shell: bash
        run: |
          cp native-artifacts/* resources/lib/
          test -s resources/lib/x86_64-windows-tree-sitter-janet.dll
          test -s resources/lib/x86_64-windows-tree-sitter.dll
      - run: clojure -M:test -n llm-context.parser.provider-test
      - run: clojure -T:build dist
      - shell: pwsh
        run: test/install-windows.ps1

  native-parser:
    name: Native parser (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            artifact: native-parser-linux-aarch64
          - runner: macos-15-intel
            platform: macos-x86_64
            artifact: native-parser-macos-x86_64
          - runner: macos-15
            platform: macos-aarch64
            artifact: native-parser-macos-aarch64
          - runner: windows-latest
            platform: windows-x86_64
            artifact: native-parser-windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: latest
      - name: Build native parser library
        shell: bash
        run: |
          mkdir -p native-artifacts
          script/build-janet-grammar.sh \
            --platform "${{ matrix.platform }}" \
            --output-dir native-artifacts
      - name: Verify native parser artifacts
        shell: bash
        run: |
          for artifact in native-artifacts/*; do
            test -s "$artifact"
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: native-artifacts/*
          if-no-files-found: error
