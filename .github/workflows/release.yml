name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  semantic-runtime:
    name: NextPlaid API (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: model
            artifact_suffix: ""
            cuda: false
            executable: next-plaid-api
            archive: tar
            ort_archive: onnxruntime-linux-x64-1.29.0.tgz
            ort_root: onnxruntime-linux-x64-1.29.0
            ort_source: lib/libonnxruntime.so.1.29.0
            ort_name: libonnxruntime.so
            ort_sha256: c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: model,cuda
            artifact_suffix: -cuda
            cuda: true
            executable: next-plaid-api
            archive: tar
            ort_archive: onnxruntime-linux-x64-gpu_cuda12-1.29.0.tgz
            ort_root: onnxruntime-linux-x64-gpu_cuda12-1.29.0
            ort_source: lib/libonnxruntime.so.1.29.0
            ort_name: libonnxruntime.so
            ort_sha256: 4ca594a0da83927befbd73fe020d7f569be151d70bb4fe9741ad405f4882e2ad
          - runner: macos-15
            target: aarch64-apple-darwin
            features: model,accelerate
            artifact_suffix: ""
            cuda: false
            executable: next-plaid-api
            archive: tar
            ort_archive: onnxruntime-osx-arm64-1.29.0.tgz
            ort_root: onnxruntime-osx-arm64-1.29.0
            ort_source: lib/libonnxruntime.1.29.0.dylib
            ort_name: libonnxruntime.dylib
            ort_sha256: d0706fc34f315d8c88639d0a8c81f2e09e815f282cabed3493c06a054352cf92
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            features: model
            artifact_suffix: ""
            cuda: false
            executable: next-plaid-api.exe
            archive: zip
            ort_archive: onnxruntime-win-x64-1.29.0.zip
            ort_root: onnxruntime-win-x64-1.29.0
            ort_source: lib/onnxruntime.dll
            ort_name: onnxruntime.dll
            ort_sha256: c9b4b7086b529ad814f428c1bad028e20a25d7dc0699836775faace4ab5b78b2
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pinned NextPlaid source
        uses: actions/checkout@v7.0.1
        with:
          repository: lightonai/next-plaid
          ref: 00e26aae0006b322727db277672211d9a0e3ccec
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Build NextPlaid API
        shell: bash
        run: |
          cargo build --locked --release \
            --target "${{ matrix.target }}" \
            -p next-plaid-api \
            --features "${{ matrix.features }}"
      - name: Package NextPlaid API
        shell: bash
        run: |
          mkdir -p package
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" package/
          cp LICENSE package/next-plaid-LICENSE
          curl --fail --location \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/${{ matrix.ort_archive }}" \
            --output onnxruntime-archive
          if command -v sha256sum >/dev/null 2>&1; then
            ort_actual_sha256="$(sha256sum onnxruntime-archive | cut -d ' ' -f 1)"
          else
            ort_actual_sha256="$(shasum -a 256 onnxruntime-archive | cut -d ' ' -f 1)"
          fi
          test "$ort_actual_sha256" = "${{ matrix.ort_sha256 }}"
          mkdir -p onnxruntime
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z x onnxruntime-archive -oonnxruntime
          else
            tar -xzf onnxruntime-archive -C onnxruntime
          fi
          cp "onnxruntime/${{ matrix.ort_root }}/${{ matrix.ort_source }}" \
            "package/${{ matrix.ort_name }}"
          if [ "${{ matrix.cuda }}" = "true" ]; then
            cp "onnxruntime/${{ matrix.ort_root }}/lib/libonnxruntime_providers_shared.so" package/
            cp "onnxruntime/${{ matrix.ort_root }}/lib/libonnxruntime_providers_cuda.so" package/
          fi
          cp "onnxruntime/${{ matrix.ort_root }}/LICENSE" \
            package/onnxruntime-LICENSE
          cp "onnxruntime/${{ matrix.ort_root }}/ThirdPartyNotices.txt" \
            package/onnxruntime-ThirdPartyNotices.txt
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd package && 7z a "../next-plaid-api-1.7.0-${{ matrix.target }}${{ matrix.artifact_suffix }}.zip" .)
          else
            tar -C package -czf "next-plaid-api-1.7.0-${{ matrix.target }}${{ matrix.artifact_suffix }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: next-plaid-api-${{ matrix.target }}${{ matrix.artifact_suffix }}
          path: next-plaid-api-1.7.0-${{ matrix.target }}${{ matrix.artifact_suffix }}.*
          if-no-files-found: error

  native-parser:
    name: Native parser (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            artifact: native-parser-linux-aarch64
          - runner: macos-15-intel
            platform: macos-x86_64
            artifact: native-parser-macos-x86_64
          - runner: macos-15
            platform: macos-aarch64
            artifact: native-parser-macos-aarch64
          - runner: windows-latest
            platform: windows-x86_64
            artifact: native-parser-windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: latest
      - name: Build native parser library
        shell: bash
        run: |
          mkdir -p native-artifacts
          script/build-janet-grammar.sh \
            --platform "${{ matrix.platform }}" \
            --output-dir native-artifacts
      - name: Verify native parser artifact
        shell: bash
        run: test -s native-artifacts/*
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: native-artifacts/*
          if-no-files-found: error

  release:
    needs: [semantic-runtime, native-parser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: zulu
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify local Linux native parser artifact
        run: test -s resources/lib/x86_64-linux-gnu-tree-sitter-janet.so
      - name: Download CI-built non-Linux native parser artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-parser-*
          path: native-artifacts
          merge-multiple: true
      - name: Assemble native parser libraries
        run: |
          cp native-artifacts/* resources/lib/
          test -s resources/lib/x86_64-linux-gnu-tree-sitter-janet.so
          test -s resources/lib/aarch64-linux-gnu-tree-sitter-janet.so
          test -s resources/lib/x86_64-macos-tree-sitter-janet.dylib
          test -s resources/lib/aarch64-macos-tree-sitter-janet.dylib
          test -s resources/lib/x86_64-windows-tree-sitter-janet.dll
          test -s resources/lib/x86_64-windows-tree-sitter.dll
      - name: Test, build, and verify release artifacts
        run: scripts/build-release.sh
      - name: Verify tag and prepare checksums
        run: |
          APP_VERSION=$(java --enable-native-access=ALL-UNNAMED -jar dist/llm-context.jar version)
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          cd dist
          sha256sum llm-context.jar > llm-context.jar.sha256
      - name: Download semantic runtime artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: next-plaid-api-*
          path: dist
          merge-multiple: true
      - name: Checksum semantic runtime artifacts
        run: |
          cd dist
          for artifact in next-plaid-api-*; do
            sha256sum "$artifact" > "$artifact.sha256"
          done
      - name: Smoke-test installer against release artifacts
        run: test/install-unix.sh
      - name: Smoke-test installed LateOn pipeline
        run: sh test/install-semantic-unix.sh "$GITHUB_WORKSPACE/dist"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-release.sh "$GITHUB_REF_NAME" dist
